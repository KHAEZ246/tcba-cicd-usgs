name: USGS Earthquake CI-CD & Azure Ingestion Pipeline

on:
  # 1. Scheduler setiap 6 jam
  schedule:
    - cron: '0 */6 * * *'
  # 2. Trigger saat ada push ke branch main
  push:
    branches: [ main ]
  # 3. Trigger saat ada pull request ke branch main
  pull_request:
    branches: [ main ]
  # 4. Trigger manual dari dashboard GitHub Actions
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test Python Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit and Integration Tests
        run: |
          python -m pytest -q

      - name: Validate Pipeline Fixture
        run: |
          python -m src.pipeline fixture

  ingest-and-upload:
    name: Batch Ingestion & Azure Upload
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        if: ${{ secrets.AZURE_CLIENT_ID != '' }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run USGS Batch Ingestion & Upload to Azure
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
        run: |
          python -m src.pipeline run --hours 6 --upload

